<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>가족 나들이 & 행사 대시보드 컬렉션</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #090a0f;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-hover-border: rgba(99, 102, 241, 0.45);
      --primary: #6366f1;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 48px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .container { max-width: 860px; width: 100%; }
    header { margin-bottom: 40px; text-align: center; }
    .badge {
      display: inline-block; padding: 6px 14px; border-radius: 9999px;
      background: var(--primary-glow); color: #a5b4fc; font-size: 13px; font-weight: 600;
      margin-bottom: 16px; border: 1px solid rgba(99, 102, 241, 0.3);
    }
    h1 {
      font-size: 32px; font-weight: 700; letter-spacing: -0.02em; margin-bottom: 12px;
      background: linear-gradient(135deg, #ffffff 40%, #a5b4fc 100%);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    p.subtitle { color: var(--text-muted); font-size: 16px; line-height: 1.6; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 20px; margin-top: 24px; }
    .card {
      background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 16px;
      padding: 24px; text-decoration: none; color: inherit; transition: all 0.25s ease;
      display: flex; flex-direction: column; justify-content: space-between; backdrop-filter: blur(12px);
    }
    .card:hover {
      border-color: var(--card-hover-border); transform: translateY(-4px);
      box-shadow: 0 16px 32px -8px rgba(0, 0, 0, 0.5), 0 0 24px -4px var(--primary-glow);
    }
    .card-meta {
      display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; gap: 8px; flex-wrap: wrap;
    }
    .card-tag { font-size: 12px; font-weight: 600; color: #38bdf8; text-transform: uppercase; letter-spacing: 0.05em; }
    .card-date {
      font-size: 12px; color: #c7d2fe; background: rgba(99, 102, 241, 0.18);
      padding: 4px 10px; border-radius: 6px; font-weight: 600; border: 1px solid rgba(99, 102, 241, 0.25);
    }
    .card-title { font-size: 19px; font-weight: 600; margin-bottom: 8px; line-height: 1.4; color: #ffffff; }
    .card-desc { font-size: 14px; color: var(--text-muted); line-height: 1.5; margin-bottom: 24px; }
    .card-footer {
      display: flex; align-items: center; justify-content: space-between; font-size: 13px;
      color: #818cf8; font-weight: 600; padding-top: 14px; border-top: 1px solid rgba(255, 255, 255, 0.05);
    }
    footer { margin-top: 60px; font-size: 13px; color: #6b7280; text-align: center; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="badge">LIVE ARCHIVE</div>
      <h1>가족 나들이 & 행사 대시보드</h1>
      <p class="subtitle">구글 드라이브에서 실시간 자동 배포되는 주말 대시보드 모음집입니다.</p>
    </header>

    <div class="grid">
      <a href="./posts/2026-10-17-weekend_dashboard.html" class="card">
        <div>
          <div class="card-meta">
            <span class="card-tag">주말 나들이</span>
            <span class="card-date">📅 생성일: 2026년 10월 17일 09:42</span>
          </div>
          <div class="card-title">은우·우준이 주말 나들이 & 행사 대시보드</div>
          <div class="card-desc">실시간 일정, 날씨, 추천 장소 및 챙길 물품 안내 종합 대시보드</div>
        </div>
        <div class="card-footer">
          <span>대시보드 보기</span>
          <span>&rarr;</span>
        </div>
      </a>
    </div>

    <footer>
      <p>&copy; 2026 Family Dashboard Archive. Hosted on <strong>dh419/website</strong>.</p>
    </footer>
  </div>
</body>
</html>
