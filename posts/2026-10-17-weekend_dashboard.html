<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>은우·우준이 주말 나들이 & 행사 대시보드</title>
  <style>
    :root {
      --bg: #f8fafc;
      --card: #ffffff;
      --primary: #2563eb;
      --primary-soft: #dbeafe;
      --green: #059669;
      --green-soft: #d1fae5;
      --purple: #7c3aed;
      --purple-soft: #ede9fe;
      --amber: #d97706;
      --amber-soft: #fef3c7;
      --text: #0f172a;
      --muted: #64748b;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Malgun Gothic", sans-serif;
    }
    .container {
      width: 100%;
      max-width: 100%;
      min-height: 100vh;
      padding: 20px;
    }
    header {
      background: linear-gradient(135deg, #1e3a8a 0%, #3b82f6 100%);
      color: #fff;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.18);
    }
    header .sub { font-size: 0.85rem; opacity: 0.9; margin-bottom: 6px; }
    header h1 { font-size: 1.5rem; font-weight: 800; margin-bottom: 12px; }
    .weather-strip { display: flex; flex-wrap: wrap; gap: 10px; font-size: 0.88rem; }
    .weather-pill {
      background: rgba(255,255,255,0.18);
      padding: 6px 14px;
      border-radius: 999px;
    }
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      margin-bottom: 20px;
    }
    .filter-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--text);
      padding: 9px 16px;
      border-radius: 999px;
      font-size: 0.9rem;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
      transition: 0.15s;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary);
    }
    .card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 18px;
    }
    .spot-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 20px;
      cursor: pointer;
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }
    .spot-card:hover {
      transform: translateY(-4px);
      box-shadow: 0 12px 24px rgba(15, 23, 42, 0.09);
      border-color: #93c5fd;
    }
    .badges { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
    .badge { font-size: 0.75rem; font-weight: 700; padding: 4px 10px; border-radius: 6px; }
    .badge.outing { background: var(--green-soft); color: var(--green); }
    .badge.festival { background: var(--purple-soft); color: var(--purple); }
    .badge.sat { background: var(--amber-soft); color: var(--amber); }
    .badge.sun { background: var(--primary-soft); color: var(--primary); }
    .spot-title { font-size: 1.15rem; font-weight: 800; margin-bottom: 6px; }
    .spot-drive { font-size: 0.85rem; color: var(--muted); margin-bottom: 12px; font-weight: 600; }
    .spot-summary { font-size: 0.9rem; color: #334155; margin-bottom: 16px; }
    .spot-footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-top: 1px dashed var(--border);
      padding-top: 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--primary);
    }
    .noodle-tag {
      background: #fffbeb;
      color: #b45309;
      border: 1px solid #fde68a;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.8rem;
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.6);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 1000;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: #fff;
      border-radius: 20px;
      max-width: 560px;
      width: 100%;
      padding: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 16px;
    }
    .close-btn {
      background: #f1f5f9;
      border: none;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      font-size: 1.2rem;
      cursor: pointer;
      font-weight: bold;
    }
    .detail-box {
      background: #f8fafc;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 12px;
      font-size: 0.92rem;
    }
    .detail-box strong { display: block; margin-bottom: 6px; color: #0f172a; }
    .noodle-detail {
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 16px;
      font-size: 0.92rem;
    }
    .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
    .map-btn {
      flex: 1;
      text-align: center;
      background: #03c75a;
      color: #fff;
      text-decoration: none;
      padding: 12px;
      border-radius: 10px;
      font-size: 0.9rem;
      font-weight: 700;
    }
    .map-btn.sub { background: #2563eb; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div class="sub">📍 동탄반석로 71 출발 · 👧 은우(7세) & 👦 우준(3세) 맞춤 대시보드</div>

    <div class="filter-bar">
      <button class="filter-btn active" onclick="filterSpots('all', this)">전체 (6)</button>
      <button class="filter-btn" onclick="filterSpots('outing', this)">🌳 나들이 (3)</button>
      <button class="filter-btn" onclick="filterSpots('festival', this)">🎉 축제·전시 (3)</button>

      <button class="filter-btn" onclick="filterSpots('sun', this)">🌧️ 일요일(우천) 추천</button>

    <div class="card-grid" id="grid"></div>
  </div>

  <div class="modal-backdrop" id="modalBackdrop" onclick="closeModal()">
    <div class="modal" onclick="event.stopPropagation()">

      <div class="detail-box">

      </div>
      <div class="detail-box">
        <strong>🚼 유모차 & 편의시설 팁</strong>
        <p id="mTip"></p>
      </div>
      <div class="noodle-detail">
        <strong id="mNoodleName" style="color:#92400e; display:block; margin-bottom:4px;"></strong>
        <p id="mNoodleDesc"></p>
      </div>
      <div class="btn-row">
        <a id="mPlaceLink" class="map-btn" target="_blank" rel="noopener">🗺️ 장소 네이버 지도 보기</a>
        <a id="mFoodLink" class="map-btn sub" target="_blank" rel="noopener">🍜 국수집 지도 보기</a>
      </div>
    </div>
  </div>

        type: 'festival', day: 'sat',

        boy: '1층 만 5세 이하 전용 유아체험관 놀이터, 야외 실물 기차 및 공룡공원 산책',

      {

        noodleTag: '🍜 신갈 총각손칼국수',

        noodleDesc: '구수하고 구수한 멸치육수 손칼국수 (박물관 관람 전후 이동 동선 최적)',
        placeQuery: '경기도어린이박물관', foodQuery: '신갈 총각손칼국수'
      }
    ];

    function renderGrid(filter = 'all') {
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      spots.forEach((s, idx) => {
        if (filter !== 'all' && s.type !== filter && s.day !== filter) return;
        const card = document.createElement('div');
        card.className = 'spot-card';
        card.onclick = () => openModal(idx);
        card.innerHTML = `
          <div>
            <div class="badges">
              <span class="badge ${s.type === 'outing' ? 'outing' : 'festival'}">${s.badgeType}</span>
              <span class="badge ${s.day === 'sat' ? 'sat' : 'sun'}">${s.badgeDay}</span>
            </div>
            <div class="spot-title">${s.title}</div>
            <div class="spot-drive">${s.drive}</div>
            <div class="spot-summary">${s.summary}</div>
          </div>
          <div class="spot-footer">
            <span class="noodle-tag">${s.noodleTag}</span>
            <span>상세 보기 →</span>
          </div>
        `;
        grid.appendChild(card);
      });
    }

    function filterSpots(filter, btn) {
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      renderGrid(filter);
    }

    function openModal(idx) {
      const s = spots[idx];
      document.getElementById('mBadges').innerHTML = `
        <span class="badge ${s.type === 'outing' ? 'outing' : 'festival'}">${s.badgeType}</span>
        <span class="badge ${s.day === 'sat' ? 'sat' : 'sun'}">${s.badgeDay}</span>
      `;
      document.getElementById('mTitle').textContent = s.title;
      document.getElementById('mDrive').textContent = s.drive;
      document.getElementById('mGirl').textContent = s.girl;
      document.getElementById('mBoy').textContent = s.boy;
      document.getElementById('mTip').textContent = s.tip;
      document.getElementById('mNoodleName').textContent = s.noodleName;
      document.getElementById('mNoodleDesc').textContent = s.noodleDesc;
      document.getElementById('mPlaceLink').href = 'https://map.naver.com/p/search/' + encodeURIComponent(s.placeQuery);
      document.getElementById('mFoodLink').href = 'https://map.naver.com/p/search/' + encodeURIComponent(s.foodQuery);
      document.getElementById('modalBackdrop').classList.add('open');
    }

    function closeModal() {
      document.getElementById('modalBackdrop').classList.remove('open');
    }

    renderGrid();
  </script>
</body>
</html>
